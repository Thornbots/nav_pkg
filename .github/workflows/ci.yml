name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: Thornbots/thornbots_workspace/.github/workflows/quality.yml@1d85c773b3c056b92ab717fba42188db11533717
    with:
      tooling-ref: 1d85c773b3c056b92ab717fba42188db11533717
  ros:
    uses: Thornbots/thornbots_workspace/.github/workflows/ros.yml@66b5f645bc69a98fe6468d33de40684f18d5c749
    with:
      package-repo: nav_pkg
      workspace-ref: 073cbb7a3606eb2a4ac7a1e249490861707d5652
